name: Backend checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock
      - run: python -m ruff check src tests scripts
      - name: Check repository names
        run: python scripts/check_repository_names.py
      - name: Verify pinned CCE and paid-load reproduction inputs (offline)
        run: python scripts/check_cce_reproducibility.py
      - name: Check runner and unit regressions in the complete checkout
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/unit
      - run: docker compose up -d --build --wait
      - run: docker compose run --rm seed
      - name: Check backend integration and end-to-end journeys
        run: docker compose run --rm --build tests pytest -q tests/integration tests/end_to_end
      - if: failure()
        run: docker compose logs --tail 200
      - if: always()
        run: docker compose down
