name: Customer demo checks
on:
  push:
    paths: ["web/demo/**", ".github/workflows/demo.yml"]
  pull_request:
    paths: ["web/demo/**", ".github/workflows/demo.yml"]
jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install pytest==8.4.2
      - run: python -m pytest -q -p no:cacheprovider web/demo/tests/test_bridge.py
      - run: node --check web/demo/dist/app.mjs
      - run: node --check web/demo/dist/api.mjs
      - run: node --test web/demo/tests/recovery.test.mjs
