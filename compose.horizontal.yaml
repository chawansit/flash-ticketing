services:
  api:
    ports: !reset []
    environment:
      DB_POOL_MAX: ${API_POOL_PER_INSTANCE:-6}
      DB_POOL_MAX_WAITING: ${API_POOL_MAX_WAITING:-${API_POOL_PER_INSTANCE:-6}}
      API_PAYMENT_POOL_MAX: ${API_PAYMENT_POOL_MAX:-0}
      API_POOL_SHARED_WAITING: ${API_POOL_SHARED_WAITING:-0}
      API_CALLBACK_ACQUISITION_RESERVE: ${API_CALLBACK_ACQUISITION_RESERVE:-0}
      RESERVE_CONCURRENCY: ${API_ADMISSION_PER_INSTANCE:-6}
      # Settings are validated as one unit in every process. The API does not run
      # payment simulation, but this value must still fit its per-replica pool.
      SIMULATOR_CONCURRENCY: ${API_SIMULATOR_PER_INSTANCE:-2}

  consumer:
    environment:
      DB_POOL_MAX: ${CONSUMER_POOL_PER_INSTANCE:-${DB_POOL_MAX:-12}}

  load-balancer:
    image: nginx:1.27.5-alpine
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    ports:
      - "${HORIZONTAL_BIND_IP:-127.0.0.1}:8000:8000"
    volumes:
      - ./docker/nginx-horizontal.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8000/lb-health"]
      interval: 5s
      timeout: 3s
      retries: 20
