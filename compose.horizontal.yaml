services:
  api:
    ports: !reset []
    environment:
      DB_POOL_MAX: ${API_POOL_PER_INSTANCE:-6}
      RESERVE_CONCURRENCY: ${API_ADMISSION_PER_INSTANCE:-6}
      # Settings are validated as one unit in every process. The API does not run
      # payment simulation, but this value must still fit its per-replica pool.
      SIMULATOR_CONCURRENCY: ${API_SIMULATOR_PER_INSTANCE:-2}

  load-balancer:
    image: nginx:1.27.5-alpine
    ports:
      - "${HORIZONTAL_BIND_IP:-127.0.0.1}:8000:8000"
    volumes:
      - ./docker/nginx-horizontal.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8000/lb-health"]
      interval: 5s
      timeout: 3s
      retries: 20
